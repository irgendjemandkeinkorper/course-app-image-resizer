name: Lint and Load Check

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint-and-check:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: HTML Lint
        run: npx htmlhint index.html --rules "tag-pair=true,spec-char-escape=false"

      - name: JS Syntax Check
        run: node lint-check.js
